<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Вход на главный экран</title>
</head>
<body>
	<div class="container">
		<h1>Авторизация</h1>
		<form id ="loginForm">
			<div>
				<p></p><input type="text" id="username" placeholder="Введите логин" required></p>
			</div>
			<div>
				<p></p><input type="password" id="password" placeholder="Введите пароль" required></p>
			</div>
			<div>
				<button type="submit">Войти</button>
			</div>
		</form>
		<p id="errorMessage"></p>
	</div>
	
</body>
</html>
