<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
	<link rel="stylesheet" href="https://cdn.sencha.com/ext/gpl/7.0.0/ext-theme-material/theme-material-all.css">
	<script src="https://cdn.sencha.com/ext/gpl/7.0.0/ext-all.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
        }
        
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        
        h1 {
            margin-bottom: 20px;
            text-align: center;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 94%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1200b3;
        }
        
        #errorMessage {
            color: red;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Авторизация</h1>
        <form id="loginForm">
            <div>
                <input type="text" id="username" placeholder="Введите логин" required>
            </div>
            <div>
                <input type="password" id="password" placeholder="Введите пароль" required>
            </div>
            <div>
                <button type="submit">Войти</button>
            </div>
        </form>
        <p id="errorMessage"></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            
            if (username === 'admin' && password === 'padmin') {
                window.location.href = 'file:///C:/Users/onypr/OneDrive/Desktop/TZ/main%20screen.html';
            } else {
                document.getElementById('errorMessage').textContent = 'Пароль или логин не верный,это фиаско!';
            }
        });
    </script>
</body>
</html>
