<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <link rel="stylesheet" href="https://cdn.sencha.com/ext/gpl/7.0.0/ext-theme-material/theme-material-all.css">
    <script src="https://cdn.sencha.com/ext/gpl/7.0.0/ext-all.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #333;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .header button:hover {
            background-color: #0056b3;
        }

        .tab-container {
            padding: 20px;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .tab-button.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        .tab-content {
            display: none;
            padding: 20px;
            background-color: white;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <button id="productsButton">Товары</button>
        </div>
        <div>
            <button id="logoutButton">Выход</button>
        </div>
    </div>

    <div class="tab-container">
        <div class="tab-buttons">
            <button class="tab-button active" data-tab="all">Все товары</button>
            <button class="tab-button" data-tab="new">Новые товары</button>
            <button class="tab-button" data-tab="popular">Популярные</button>
        </div>

        <div class="tab-content active" id="tab-all">
            <h2>Все товары</h2>
            <ul>
                <li>Товар 1</li>
                <li>Товар 2</li>
                <li>Товар 3</li>
            </ul>
        </div>

        <div class="tab-content" id="tab-new">
            <h2>Новые товары</h2>
            <ul>
                <li>Новый товар 1</li>
                <li>Новый товар 2</li>
            </ul>
        </div>

        <div class="tab-content" id="tab-popular">
            <h2>Популярные товары</h2>
            <ul>
                <li>Популярный товар 1</li>
                <li>Популярный товар 2</li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Обработка вкладок
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabContents = document.querySelectorAll('.tab-content');

            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetTab = button.getAttribute('data-tab');

                    // Сброс активных классов
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));

                    // Активируем выбранную вкладку
                    button.classList.add('active');
                    document.getElementById(`tab-${targetTab}`).classList.add('active');
                });
            });

            // Обработка кнопки "Выход"
            document.getElementById('logoutButton').addEventListener('click', function() {
                window.location.href = 'file:///C:/Users/onypr/OneDrive/Desktop/TZ/T3_Aiti_Guru.html?';
            });
        });
    </script>
</body>
</html>
